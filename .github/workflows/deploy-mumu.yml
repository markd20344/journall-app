name: Mumu — test and deploy to Firebase Hosting

# Mumu deploys separately from the GitHub Pages apps (deploy.yml): it lives
# on Firebase Hosting so Google sign-in stays on its own origin, which is
# what makes sign-in reliable in the installed iPhone app.
on:
  push:
    branches: [main]
    paths:
      - apps/mumu/**
      - packages/shared/**
      - tests/rules/**
      - firebase.json
      - firestore.rules
      - package-lock.json
      - .github/workflows/deploy-mumu.yml
  pull_request:
    paths:
      - apps/mumu/**
      - packages/shared/**
      - tests/rules/**
      - firebase.json
      - firestore.rules
      - .github/workflows/deploy-mumu.yml
  # Manual "Run workflow" button: deploys whichever branch you pick.
  workflow_dispatch:

concurrency:
  group: mumu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firebase emulators (rules tests, e2e) need Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b apps/mumu
      - run: npm run test:mumu
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:mumu

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mumu
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_OWNER_UID: ${{ secrets.MUMU_OWNER_UID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
